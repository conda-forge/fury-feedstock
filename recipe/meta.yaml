{% set name = "fury" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 35891b750219719a7a01b77b0e0ade424d64513fee96f4efc54297aca6d002ef

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
    - setuptools_scm

  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - vtk
    - matplotlib-base
    - six
    - pillow
    - packaging
    - pygltflib
    - aiohttp
    - lazy_loader

test:
  requires:
    - python {{ python_min }}
  imports:
    - fury

about:
  home: http://github.com/fury-gl/fury
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Free Unified Rendering for Python - Scientific Visualization
  description: |
    Free Unified Rendering for Python (FURY) is a library that offers
    a collection of new widgets, functionnality to vtk. It works under
    Python 2.7 and Python 3.4+
  doc_url: http://fury.gl/
  dev_url: https://github.com/fury-gl/fury

extra:
  recipe-maintainers:
    - skoudoro
    - garyfallidis
